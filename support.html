<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержка АЮЛ</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            line-height: 1.6; 
            color: #333; 
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 20px; }
        p { color: #666; margin-bottom: 25px; }
        .email-link {
            display: inline-block;
            font-size: 1.2em;
            font-weight: 600;
            color: #57B4FA;
            text-decoration: none;
            padding: 12px 24px;
            border: 2px solid #57B4FA;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .email-link:hover {
            background-color: #57B4FA;
            color: #fff;
        }
        .response-time {
            margin-top: 30px;
            font-size: 0.85em;
            color: #CD88FC;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Поддержка АЮЛ</h1>
        <p>Если у вас возникли вопросы по работе приложения или появились предложения, мы всегда готовы помочь.</p>
        
        <a href="mailto:oleessever@gmail.com" class="email-link">oleessever@gmail.com</a>
        
        <p class="response-time">Мы стараемся отвечать на все обращения в течение 48 часов.</p>
    </div>

</body>
</html>
